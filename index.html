<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-SHARK | Elite Prep</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#0df2f2', dark: '#080c0c', panel: '#111a1a' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-dark text-slate-200 antialiased selection:bg-primary/30">

    <nav id="top-nav" class="fixed top-0 w-full z-50 bg-dark/90 backdrop-blur-md border-b border-white/5 px-6 py-4 transition-transform duration-300">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.router('dashboard')">
                <span class="text-primary material-symbols-outlined text-3xl">tsunami</span>
                <h1 class="text-2xl font-black tracking-tighter uppercase italic">I-SHARK</h1>
            </div>
            
            <div id="nav-links" class="hidden md:flex gap-6 text-sm font-bold text-slate-400">
                <button onclick="window.router('vault')" class="nav-link hover:text-primary transition-colors" data-route="vault">Vault</button>
                <button onclick="window.router('alerts')" class="nav-link hover:text-primary transition-colors" data-route="alerts">Alerts</button>
                <button onclick="window.router('leaderboard')" class="nav-link hover:text-primary transition-colors" data-route="leaderboard">Leaderboard</button>
            </div>

            <div id="auth-layer" class="flex items-center gap-4">
                <button id="login-btn" onclick="window.login()" class="btn-primary px-4 py-2 rounded-lg text-sm">LOGIN</button>
                <div id="user-profile" class="hidden flex items-center gap-4">
                    <div class="text-right hidden sm:block">
                        <p class="text-[10px] text-primary font-bold tracking-widest uppercase">Experience</p>
                        <p class="text-xs font-mono">Level <span id="nav-level">1</span> • <span id="nav-xp">0</span> XP</p>
                    </div>
                    <div class="relative">
                        <div onclick="document.getElementById('profile-dropdown').classList.toggle('hidden')" class="h-10 w-10 rounded-full border-2 border-primary/30 flex items-center justify-center bg-primary/10 text-primary font-bold cursor-pointer transition-all hover:border-primary shadow-lg shadow-primary/20">
                            <span id="user-initial">U</span>
                        </div>
                        <div id="profile-dropdown" class="absolute right-0 mt-4 w-48 glass-panel rounded-xl py-2 hidden z-50 border border-primary/30 shadow-2xl">
                            <button id="admin-link" onclick="window.router('admin'); document.getElementById('profile-dropdown').classList.add('hidden')" class="hidden w-full text-left px-4 py-3 text-sm text-primary hover:bg-white/10 font-bold border-b border-white/5">Command Center</button>
                            <button onclick="window.logout()" class="w-full text-left px-4 py-3 text-sm text-rose-400 hover:bg-white/10 font-bold">Sign Out</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main id="view-container" class="pt-28 pb-24 px-4 sm:px-6 max-w-7xl mx-auto min-h-screen">
        <div class="space-y-6 w-full max-w-5xl mx-auto">
            <div>
                <div class="skeleton-box h-10 w-1/3 mb-3 rounded-lg"></div>
                <div class="skeleton-box h-4 w-1/2 rounded"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2 skeleton-box h-48 rounded-2xl"></div>
                <div class="skeleton-box h-48 rounded-2xl"></div>
            </div>
            <div class="skeleton-box h-40 rounded-2xl"></div>
        </div>
    </main>

    <div id="mobile-nav" class="md:hidden fixed bottom-0 left-0 w-full bg-dark/95 backdrop-blur-lg border-t border-white/10 flex justify-around items-center px-2 py-3 z-50 pb-safe transition-transform duration-300">
        <button onclick="window.router('dashboard')" class="mobile-nav-link flex flex-col items-center gap-1 text-slate-500" data-route="dashboard">
            <span class="material-symbols-outlined text-2xl">dashboard</span>
            <span class="text-[10px] font-bold uppercase tracking-widest">Base</span>
        </button>
        <button onclick="window.router('vault')" class="mobile-nav-link flex flex-col items-center gap-1 text-slate-500" data-route="vault">
            <span class="material-symbols-outlined text-2xl">folder_open</span>
            <span class="text-[10px] font-bold uppercase tracking-widest">Vault</span>
        </button>
        <button onclick="window.router('alerts')" class="mobile-nav-link flex flex-col items-center gap-1 text-slate-500" data-route="alerts">
            <span class="material-symbols-outlined text-2xl">notifications</span>
            <span class="text-[10px] font-bold uppercase tracking-widest">Alerts</span>
        </button>
        <button onclick="window.router('leaderboard')" class="mobile-nav-link flex flex-col items-center gap-1 text-slate-500" data-route="leaderboard">
            <span class="material-symbols-outlined text-2xl">trophy</span>
            <span class="text-[10px] font-bold uppercase tracking-widest">Ranks</span>
        </button>
    </div>

    <div id="toast-container"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log("I-SHARK PWA: Online"))
          .catch(err => console.log("PWA Error:", err));
      }
    </script>

</body>
</html>
