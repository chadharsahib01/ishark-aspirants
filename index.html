<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-SHARK | Elite Aspirant Portal</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-100 selection:bg-cyan-500/30 antialiased">

    <nav class="fixed top-0 left-0 w-full z-50 nav-blur px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.router('home')">
                <span class="text-primary material-symbols-outlined text-3xl">tsunami</span>
                <h1 class="text-xl font-black tracking-tighter uppercase italic">I-SHARK</h1>
            </div>
            
            <div id="auth-layer">
                <button id="login-btn" onclick="window.login()" class="text-xs font-black uppercase tracking-widest text-primary hover:text-white transition-colors">Login</button>
                <div id="user-profile" class="hidden flex items-center gap-4">
                    <span id="nav-xp" class="text-xs font-mono text-cyan-400">0 XP</span>
                    <div id="admin-link" class="hidden cursor-pointer text-xs font-bold text-red-400 border border-red-400/30 px-2 py-1 rounded" onclick="window.router('admin')">ADMIN</div>
                    <div class="h-9 w-9 rounded-full border border-primary/30 flex items-center justify-center bg-primary/10 text-primary font-bold cursor-pointer hover:bg-primary hover:text-black transition-all" onclick="window.logout()">
                        <span id="user-initial">?</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main id="view-container" class="pt-32 pb-20 px-6 max-w-6xl mx-auto min-h-screen">
        <div id="boot-loader" class="flex flex-col items-center justify-center py-40">
            <div class="loader-ring"></div>
            <p class="mt-4 text-[10px] font-black uppercase tracking-[0.3em] text-primary animate-pulse">Establishing Secure Link</p>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
