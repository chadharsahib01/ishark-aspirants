<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-SHARK Aspirants | 2026</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet">
    <style>
        :root { --primary: #0df2f2; --obsidian: #080c0c; }
        body { background-color: var(--obsidian); font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(24, 52, 52, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(13, 242, 242, 0.1); }
        .nav-blur { background: rgba(8, 12, 12, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .btn-primary { background: var(--primary); color: var(--obsidian); font-weight: 900; border-radius: 8px; transition: 0.3s; }
        .btn-primary:hover { filter: brightness(1.2); transform: translateY(-1px); box-shadow: 0 0 20px rgba(13, 242, 242, 0.4); }
        .urdu-text { font-family: 'Noto Nastaliq Urdu', serif; direction: rtl; }
        .loader { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-100 selection:bg-primary/30 antialiased">

    <nav class="fixed top-0 left-0 w-full z-50 nav-blur px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.router('home')">
                <span class="text-primary material-symbols-outlined text-3xl">tsunami</span>
                <h1 class="text-xl font-black tracking-tighter uppercase italic">I-SHARK</h1>
            </div>
            
            <div id="auth-layer">
                <button id="login-btn" onclick="window.login()" class="text-xs font-black uppercase tracking-widest text-primary hover:text-white transition-colors">Login</button>
                <div id="user-profile" class="hidden flex items-center gap-4">
                    <span id="nav-xp" class="text-xs font-mono text-white">0 XP</span>
                    <div class="h-9 w-9 rounded-full border border-primary/30 flex items-center justify-center bg-primary/10 text-primary font-bold cursor-pointer" onclick="window.logout()">
                        <span id="user-initial">?</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main id="view-container" class="pt-32 pb-20 px-6 max-w-6xl mx-auto min-h-screen">
        <div id="boot-loader" class="flex flex-col items-center justify-center py-40">
            <div class="loader"></div>
            <p class="mt-4 text-[10px] font-black uppercase tracking-[0.3em] text-primary animate-pulse">Establishing Link</p>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
