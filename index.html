<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>I-SHARK Aspirants | Professional Vault</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap');
    body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top right, #1e293b, #0f172a); color: white; min-height: 100vh; }
    .urdu-text { font-family: 'Noto Nastaliq Urdu', serif; direction: rtl; line-height: 2.5; }
    .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
    .hidden-view { display: none !important; }
    .opt-btn { transition: all 0.2s; border: 2px solid rgba(255,255,255,0.1); }
    .opt-btn:hover { background: rgba(255,255,255,0.05); border-color: #22d3ee; }
    .correct { background: rgba(34, 197, 94, 0.2) !important; border-color: #22c55e !important; }
    .wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: #ef4444 !important; }
  </style>
</head>
<body>

  <div id="app" class="flex flex-col min-h-screen">
    <nav class="p-4 border-b border-white/10 glass sticky top-0 z-50">
      <div class="max-w-6xl mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-black text-cyan-400 tracking-tighter cursor-pointer" onclick="router('home')">I-SHARK</h1>
        <div id="auth-section">
            <button onclick="handleAuth()" id="login-btn" class="text-sm font-bold bg-white/10 px-4 py-2 rounded-full">Login</button>
            <span id="user-name" class="hidden text-sm font-bold text-cyan-200"></span>
        </div>
      </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-5xl">
      
      <div id="view-loading" class="flex flex-col items-center justify-center py-20">
        <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-bold text-cyan-400 animate-pulse">CONNECTING TO SECURE DATABASE...</p>
      </div>

      <div id="view-home" class="hidden-view space-y-8">
        <div class="glass p-8 flex flex-col md:flex-row justify-between items-center gap-6">
          <div>
            <h2 class="text-4xl font-bold mb-1">Welcome Back</h2>
            <p class="text-gray-400">Current Score: <span id="xp-display" class="text-cyan-400 font-bold">0</span> XP</p>
          </div>
          <button onclick="router('subjects')" class="w-full md:w-auto bg-cyan-500 hover:bg-cyan-400 text-black font-black px-10 py-4 rounded-xl shadow-lg shadow-cyan-500/20 transition-all">START PRACTICE</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div class="lg:col-span-2 glass overflow-hidden">
            <div class="p-4 border-b border-white/10 bg-white/5 flex justify-between items-center">
                <span class="font-black text-xs uppercase tracking-widest text-gray-400">Live Alerts</span>
                <span class="urdu-text text-cyan-400 font-bold">تازہ ترین اپڈیٹس</span>
            </div>
            <div id="notif-list" class="p-4 space-y-4 divide-y divide-white/5 max-h-[400px] overflow-y-auto">
                </div>
          </div>

          <div class="glass p-6">
            <h3 class="font-bold text-lg mb-4">Recent History</h3>
            <div id="history-feed" class="space-y-3 text-sm text-gray-500 italic">Login to track progress</div>
          </div>
        </div>
      </div>

      <div id="view-subjects" class="hidden-view">
        <h2 class="text-3xl font-bold mb-8">Choose Subject</h2>
        <div id="subject-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>

      <div id="view-quiz" class="hidden-view max-w-3xl mx-auto">
        <div class="glass p-8 mb-6">
          <div id="quiz-header" class="flex justify-between text-xs font-bold text-gray-500 mb-6 uppercase tracking-widest"></div>
          <h3 id="question-text" class="text-2xl font-semibold leading-relaxed mb-8"></h3>
          <div id="options-container" class="space-y-4"></div>
        </div>
        <div class="flex justify-between items-center">
            <button onclick="if(confirm('Quit?')) router('home')" class="text-gray-500 font-bold">Quit</button>
            <button id="next-btn" onclick="nextQuestion()" class="hidden bg-white text-black px-10 py-3 rounded-lg font-bold">Next Question →</button>
        </div>
      </div>

      <div id="view-result" class="hidden-view glass p-12 text-center max-w-lg mx-auto">
        <div class="text-6xl mb-6">🏆</div>
        <h2 class="text-3xl font-bold mb-2">Quiz Complete</h2>
        <p id="final-score" class="text-5xl font-black text-cyan-400 my-6"></p>
        <button onclick="router('home')" class="w-full bg-white/10 border border-white/20 py-4 rounded-xl font-bold hover:bg-white/20 transition">Return to Dashboard</button>
      </div>

    </main>
  </div>

  <script>
    // 1. DATABASE CONFIG
    const firebaseConfig = { apiKey: "AIzaSyC8nptTKV3cJtnkri-hDZNCTidlMeGcCIs", authDomain: "i-shark.firebaseapp.com", projectId: "i-shark", storageBucket: "i-shark.firebasestorage.app", messagingSenderId: "304378182943", appId: "1:304378182943:web:305b03b013367c8ff1c42a" };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let state = { mcqs: [], notifications: [], subjects: [], user: null, xp: 0 };
    let quizState = { current: [], index: 0, score: 0, active: false };

    // 2. DATA ENGINES (DIRECT FIREBASE)
    async function boot() {
        try {
            // Fetch Notifications (Ordered by Newest)
            const nSnap = await db.collection('notifications').orderBy('timestamp', 'desc').limit(20).get();
            state.notifications = nSnap.docs.map(d => d.data());

            // Fetch MCQs
            const mSnap = await db.collection('mcqs').get();
            state.mcqs = mSnap.docs.map(d => d.data());
            state.subjects = [...new Set(state.mcqs.map(m => m.Subject))];

            router('home');
        } catch (e) {
            console.error(e);
            alert("Database Connection Failed. Check Rules.");
        }
    }

    // 3. UI CONTROLLERS
    function router(view) {
        document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden-view'));
        document.getElementById('view-' + view).classList.remove('hidden-view');
        window.scrollTo(0,0);
        if(view === 'home') renderHome();
        if(view === 'subjects') renderSubjects();
    }

    function renderHome() {
        document.getElementById('xp-display').innerText = state.xp;
        const list = document.getElementById('notif-list');
        list.innerHTML = state.notifications.map(n => `
            <div class="pt-4 first:pt-0">
                <span class="text-[10px] font-bold text-gray-600 uppercase">${n.Date}</span>
                <a href="${n.Link}" target="_blank" class="block text-cyan-300 font-bold hover:text-white transition-colors">${n.Title}</a>
            </div>
        `).join('');
    }

    function renderSubjects() {
        const grid = document.getElementById('subject-grid');
        grid.innerHTML = state.subjects.map(s => `
            <div onclick="initQuiz('${s}')" class="glass p-6 cursor-pointer hover:border-cyan-500/50 transition-all group">
                <h3 class="text-xl font-bold group-hover:text-cyan-400">${s}</h3>
                <p class="text-xs text-gray-500 mt-2 uppercase font-bold tracking-widest">Practice Mode</p>
            </div>
        `).join('');
    }

    // 4. QUIZ ENGINE
    function initQuiz(sub) {
        const questions = state.mcqs.filter(m => m.Subject === sub).sort(() => 0.5 - Math.random()).slice(0, 10);
        quizState = { current: questions, index: 0, score: 0, active: true };
        router('quiz');
        renderQuestion();
    }

    function renderQuestion() {
        const q = quizState.current[quizState.index];
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('quiz-header').innerText = `Subject: ${q.Subject} | Question ${quizState.index + 1}/10`;
        document.getElementById('question-text').innerText = q.Question;
        
        const opts = ['A', 'B', 'C', 'D'];
        document.getElementById('options-container').innerHTML = opts.map(o => `
            <div onclick="handleAnswer(this, '${o}')" class="p-5 glass opt-btn cursor-pointer flex items-center gap-4">
                <span class="w-8 h-8 rounded bg-white/5 flex items-center justify-center font-bold text-xs">${o}</span>
                <span class="font-medium">${q['Option'+o]}</span>
            </div>
        `).join('');
    }

    function handleAnswer(el, choice) {
        if(!quizState.active) return;
        quizState.active = false;
        const correct = quizState.current[quizState.index].CorrectOption.trim().toUpperCase();
        
        if(choice === correct) {
            el.classList.add('correct');
            quizState.score++;
        } else {
            el.classList.add('wrong');
            // Flash correct one
            Array.from(document.getElementsByClassName('opt-btn')).forEach(btn => {
                if(btn.innerText.includes(correct + "\n")) btn.classList.add('correct');
            });
        }
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        quizState.index++;
        quizState.active = true;
        if(quizState.index >= quizState.current.length) {
            finish();
        } else {
            renderQuestion();
        }
    }

    function finish() {
        const earned = quizState.score * 10;
        state.xp += earned;
        localStorage.setItem('xp', state.xp);
        document.getElementById('final-score').innerText = `${quizState.score} / 10`;
        router('result');
        // Save to Firebase if logged in
        if(state.user) {
            db.collection('users').doc(state.user.uid).collection('history').add({
                score: quizState.score,
                subject: quizState.current[0].Subject,
                date: new Date()
            });
        }
    }

    // 5. AUTH
    function handleAuth() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            state.user = user;
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('user-name').innerText = user.displayName.split(' ')[0];
            document.getElementById('user-name').classList.remove('hidden');
        }
    });

    document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
