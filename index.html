<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-SHARK Aspirants | 2026 Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#050505] text-slate-200">
    <div id="app" class="min-h-screen flex flex-col">
        <nav class="glass-nav sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-cyan-400 cursor-pointer" onclick="router('home')">I-SHARK</h1>
            <div id="auth-ui">
                <button onclick="login()" id="login-btn" class="btn-primary">Login</button>
                <div id="user-profile" class="hidden flex items-center gap-3">
                    <span id="user-name" class="text-xs font-bold text-cyan-400"></span>
                    <button onclick="logout()" class="text-[10px] opacity-50 uppercase">Sign Out</button>
                </div>
            </div>
        </nav>

        <main id="view-container" class="flex-grow container mx-auto max-w-5xl px-4 py-8">
            <div id="loader" class="flex flex-col items-center py-24">
                <div class="loader-ring"></div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
